<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Prancheta PTT • Rádio Comunicador</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#121212',
                        cardbg: '#1e1e1e',
                        accent: '#f97316'
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome & Inter -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Socket.io Client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #f3f4f6; }
        .ptt-btn {
            background: radial-gradient(circle, #f97316 0%, #c2410c 100%);
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.4);
            transition: all 0.1s ease;
        }
        .ptt-btn.active {
            transform: scale(0.95);
            background: radial-gradient(circle, #ef4444 0%, #991b1b 100%);
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.8);
        }
        .ptt-btn.receiving {
            background: radial-gradient(circle, #22c55e 0%, #15803d 100%);
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.8);
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden select-none">

    <!-- Áudio Remoto WebRTC -->
    <audio id="audioRemoto" autoplay playsinline></audio>

    <!-- Top Bar -->
    <header class="bg-[#18181b] border-b border-gray-800 px-4 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <button onclick="abrirPerfil()" class="relative">
                <div class="w-10 h-10 rounded-full bg-gray-700 overflow-hidden border-2 border-orange-500 flex items-center justify-center font-bold text-white" id="avatarTopo">
                    C
                </div>
                <span id="dotStatusSocket" class="absolute bottom-0 right-0 w-3 h-3 bg-yellow-500 border-2 border-[#18181b] rounded-full"></span>
            </button>
            <div>
                <h1 class="font-bold text-sm leading-tight text-white flex items-center gap-1">
                    prancheta taxi especial confins <i class="fa-solid fa-lock text-xs text-gray-400"></i>
                </h1>
                <div class="flex items-center space-x-2 text-xs text-gray-400">
                    <span id="statusLinhaDisplay" class="text-yellow-400 font-medium">● Conectando... (ID: <span id="meuNumSpan">31984280227</span>)</span>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="iniciarChamadaWebRTC()" class="bg-green-600/20 text-green-400 border border-green-600/40 px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1" title="Abrir canal de voz P2P">
                <i class="fa-solid fa-walkie-talkie"></i> Ligar P2P
            </button>
            <button onclick="abrirConfiguracoesLinha()" class="text-orange-500 text-lg p-1.5" title="Configurar Servidor & Números">
                <i class="fa-solid fa-sliders"></i>
            </button>
        </div>
    </header>

    <!-- Sub-header: Canal Status / Seletor -->
    <div class="bg-[#1f1f23] px-4 py-2 border-b border-gray-800 flex items-center justify-between text-xs shrink-0">
        <div class="flex items-center space-x-2">
            <span class="bg-orange-500/20 text-orange-400 px-2 py-0.5 rounded font-semibold">SOCKET.IO P2P</span>
            <span class="text-gray-300">Destino: <strong id="destinoHeaderSpan" class="text-white">31975644571</strong></span>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="alternarBloqueioPTT()" id="btnTravaPTT" class="text-gray-400 hover:text-white px-2 py-1 rounded bg-gray-800">
                <i class="fa-solid fa-lock-open mr-1"></i> Trava PTT
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto relative flex flex-col justify-between p-4">
        
        <!-- Feed / Mensagens recentes -->
        <div id="chatFeed" class="space-y-2.5 overflow-y-auto pr-1 flex-1 mb-3">
            <div class="text-center my-1">
                <span class="bg-gray-800/80 text-gray-400 text-[10px] px-3 py-1 rounded-full uppercase tracking-wider">Canal Direto Socket.io + WebRTC</span>
            </div>
        </div>

        <!-- Centro: Botão Gigante PTT -->
        <div class="flex flex-col items-center justify-center my-auto py-4">
            <div class="relative flex items-center justify-center">
                <div id="ondaAudio" class="absolute w-44 h-44 rounded-full border-2 border-orange-500/40 animate-ping hidden"></div>
                
                <button id="pttMainBtn" 
                        onmousedown="iniciarTransmissao()" onmouseup="pararTransmissao()" 
                        ontouchstart="iniciarTransmissao(); event.preventDefault();" ontouchend="pararTransmissao(); event.preventDefault();"
                        class="ptt-btn w-36 h-36 rounded-full flex flex-col items-center justify-center text-white cursor-pointer shadow-2xl relative z-10 select-none">
                    <i class="fa-solid fa-microphone text-4xl mb-1" id="pttIcon"></i>
                    <span class="text-xs font-bold tracking-widest uppercase" id="pttLabel">PTT</span>
                    <span class="text-[9px] opacity-80">SEGURE PARA FALAR</span>
                </button>
            </div>
            <p class="text-xs text-gray-400 mt-4 text-center font-medium" id="pttStatusText">Pronto para transmitir</p>
        </div>

        <!-- Barra inferior de Comandos Rápidos -->
        <div class="grid grid-cols-4 gap-2 bg-[#18181b] p-2 rounded-xl border border-gray-800 shrink-0">
            <button onclick="enviarLocalizacaoGPS()" class="bg-gray-800 hover:bg-gray-700 text-orange-400 text-xs py-2.5 px-1 rounded-lg flex flex-col items-center">
                <i class="fa-solid fa-location-dot mb-1 text-sm"></i> GPS
            </button>
            <button onclick="enviarComandoAutomatico('🟢 QSL / Positivo na escuta')" class="bg-gray-800 hover:bg-gray-700 text-green-400 text-xs py-2.5 px-1 rounded-lg flex flex-col items-center">
                <i class="fa-solid fa-check-double mb-1 text-sm"></i> QSL
            </button>
            <button onclick="enviarComandoAutomatico('🚕 QAP Ponto Confins')" class="bg-gray-800 hover:bg-gray-700 text-blue-400 text-xs py-2.5 px-1 rounded-lg flex flex-col items-center">
                <i class="fa-solid fa-taxi mb-1 text-sm"></i> QAP
            </button>
            <button onclick="enviarComandoAutomatico('⚠️ Alerta QRR Prioritário')" class="bg-gray-800 hover:bg-gray-700 text-red-400 text-xs py-2.5 px-1 rounded-lg flex flex-col items-center">
                <i class="fa-solid fa-triangle-exclamation mb-1 text-sm"></i> QRR
            </button>
        </div>
    </main>

    <!-- Modal / Drawer de Configuração Socket.io & Números -->
    <div id="modalConfigLinha" class="fixed inset-0 bg-black/80 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-[#1e1e1e] w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-6 border border-gray-800 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-white font-bold text-lg flex items-center gap-2">
                    <i class="fa-solid fa-server text-orange-500"></i> Servidor Socket.io & Linhas
                </h3>
                <button onclick="fecharConfiguracoesLinha()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-gray-300">URL do Servidor Node.js (Render / Railway):</label>
                    <input type="url" id="inputServerUrl" placeholder="https://seu-app.onrender.com" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white text-xs mt-1 focus:border-orange-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs font-semibold text-gray-300">Meu Número (Sala):</label>
                        <input type="text" id="inputMeuNum" value="31984280227" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white text-sm mt-1 focus:border-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-300">Número Destino:</label>
                        <input type="text" id="inputDestinoNum" value="31975644571" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white text-sm mt-1 focus:border-orange-500 outline-none">
                    </div>
                </div>

                <!-- Atalho rápido para alternar entre Telefone 1 e Telefone 2 -->
                <div class="flex gap-2">
                    <button type="button" onclick="preencherTelefone(1)" class="flex-1 bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 py-2 rounded border border-gray-700">
                        Perfil Tel 1 (0227)
                    </button>
                    <button type="button" onclick="preencherTelefone(2)" class="flex-1 bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 py-2 rounded border border-gray-700">
                        Perfil Tel 2 (4571)
                    </button>
                </div>

                <button onclick="salvarEConectarSocket()" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-lg text-sm shadow">
                    Salvar e Registrar Sala Socket.io
                </button>

                <div class="bg-gray-900/80 p-3 rounded-lg border border-gray-800">
                    <div class="text-xs font-bold text-orange-400 mb-1">Unidades Online no Servidor:</div>
                    <div id="listaOnlineContainer" class="text-xs text-gray-300 flex flex-wrap gap-1.5 mt-1">
                        <span class="text-gray-500">Nenhuma conectada</span>
                    </div>
                </div>

                <div class="pt-1">
                    <a id="linkChamadaGSM" href="tel:+5531975644571" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2.5 rounded-lg text-center block text-sm">
                        <i class="fa-solid fa-phone mr-2"></i> Discar via Operadora (GSM)
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Perfil -->
    <div id="modalPerfil" class="fixed inset-0 bg-black/80 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-[#1e1e1e] w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-6 border border-gray-800">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 rounded-full bg-orange-600 flex items-center justify-center font-bold text-xl text-white">C</div>
                    <div>
                        <h2 class="text-white font-bold text-base">Clenilsonmiter</h2>
                        <span class="text-xs text-orange-400" id="numPerfilDisplay">31984280227</span>
                    </div>
                </div>
                <button onclick="fecharPerfil()" class="text-gray-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-2">
                <button onclick="abrirConfiguracoesLinha(); fecharPerfil();" class="w-full bg-gray-800 hover:bg-gray-700 p-3 rounded-lg flex items-center justify-between text-sm text-white">
                    <span><i class="fa-solid fa-sliders text-orange-500 mr-2"></i> Configurar Servidor Socket.io / Números</span>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </button>
                <button onclick="limparNotificacoes()" class="w-full bg-gray-800 hover:bg-gray-700 p-3 rounded-lg flex items-center justify-between text-sm text-white">
                    <span><i class="fa-solid fa-broom text-orange-500 mr-2"></i> Limpar Histórico da Tela</span>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURAÇÃO PWA DINÂMICA ---
        const manifestData = {
            name: "Prancheta PTT Rádio",
            short_name: "Prancheta PTT",
            start_url: ".",
            display: "standalone",
            background_color: "#121212",
            theme_color: "#f97316",
            icons: [{
                src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23f97316'/><text x='50' y='67' font-size='50' text-anchor='middle' fill='white'>📻</text></svg>",
                sizes: "192x192",
                type: "image/svg+xml"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(manifestBlob);
        const linkManifest = document.createElement('link');
        linkManifest.rel = 'manifest';
        linkManifest.href = manifestURL;
        document.head.appendChild(linkManifest);

        // --- 2. VARIÁVEIS DE ESTADO E STORAGE ---
        let serverUrl = localStorage.getItem('ptt_server_url') || "http://localhost:3000";
        let meuNumero = localStorage.getItem('ptt_meu_num') || "31984280227";
        let numeroDestino = localStorage.getItem('ptt_dest_num') || "31975644571";

        let socket = null;
        let localStream = null;
        let peerConnection = null;
        let isTransmitting = false;
        let travaPTTAtiva = false;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // Preenche campos iniciais
        document.getElementById('inputServerUrl').value = serverUrl;
        atualizarInterfaceNumeros();

        function atualizarInterfaceNumeros() {
            document.getElementById('inputMeuNum').value = meuNumero;
            document.getElementById('inputDestinoNum').value = numeroDestino;
            document.getElementById('meuNumSpan').innerText = meuNumero;
            document.getElementById('destinoHeaderSpan').innerText = numeroDestino;
            document.getElementById('numPerfilDisplay').innerText = meuNumero;
            document.getElementById('linkChamadaGSM').href = `tel:+55${numeroDestino}`;
        }

        function preencherTelefone(tipo) {
            if (tipo === 1) {
                document.getElementById('inputMeuNum').value = "31984280227";
                document.getElementById('inputDestinoNum').value = "31975644571";
            } else {
                document.getElementById('inputMeuNum').value = "31975644571";
                document.getElementById('inputDestinoNum').value = "31984280227";
            }
        }

        // --- 3. CONEXÃO SOCKET.IO ---
        function salvarEConectarSocket() {
            serverUrl = document.getElementById('inputServerUrl').value.trim();
            meuNumero = document.getElementById('inputMeuNum').value.trim();
            numeroDestino = document.getElementById('inputDestinoNum').value.trim();

            localStorage.setItem('ptt_server_url', serverUrl);
            localStorage.setItem('ptt_meu_num', meuNumero);
            localStorage.setItem('ptt_dest_num', numeroDestino);

            atualizarInterfaceNumeros();
            fecharConfiguracoesLinha();
            conectarSocketIO();
        }

        function conectarSocketIO() {
            if (socket) {
                socket.disconnect();
            }

            const statusDisplay = document.getElementById('statusLinhaDisplay');
            const dot = document.getElementById('dotStatusSocket');
            statusDisplay.innerHTML = `● Conectando... (ID: ${meuNumero})`;
            statusDisplay.className = "text-yellow-400 font-medium";
            dot.className = "absolute bottom-0 right-0 w-3 h-3 bg-yellow-500 border-2 border-[#18181b] rounded-full";

            socket = io(serverUrl, { transports: ['websocket', 'polling'] });

            socket.on('connect', () => {
                // Registra o número na sala Socket.io
                socket.emit('registrar', meuNumero);
                statusDisplay.innerHTML = `● Online (ID: ${meuNumero})`;
                statusDisplay.className = "text-green-400 font-medium";
                dot.className = "absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-[#18181b] rounded-full";
                adicionarMensagemFeed(`Conectado à sala Socket.io: ${meuNumero}`, 'sistema');
            });

            socket.on('disconnect', () => {
                statusDisplay.innerHTML = `● Desconectado (ID: ${meuNumero})`;
                statusDisplay.className = "text-red-400 font-medium";
                dot.className = "absolute bottom-0 right-0 w-3 h-3 bg-red-500 border-2 border-[#18181b] rounded-full";
            });

            // Atualiza lista de números online
            socket.on('lista-online', (lista) => {
                const container = document.getElementById('listaOnlineContainer');
                if (!lista || lista.length === 0) {
                    container.innerHTML = '<span class="text-gray-500">Nenhuma conectada</span>';
                    return;
                }
                container.innerHTML = lista.map(num => `
                    <span onclick="selecionarDestinoRapido('${num}')" class="cursor-pointer bg-green-900/40 text-green-300 border border-green-700/50 px-2 py-0.5 rounded">
                        ● ${num}
                    </span>
                `).join('');
            });

            // Recebe status PTT do outro telefone
            socket.on('ptt-status', ({ remetente, acao }) => {
                const btn = document.getElementById('pttMainBtn');
                const txt = document.getElementById('pttStatusText');
                if (acao === 'falando') {
                    tocarBiPeInicio();
                    btn.classList.add('receiving');
                    txt.innerText = `🔊 RECEBENDO ÁUDIO DE ${remetente}...`;
                    txt.className = "text-xs text-green-400 mt-4 text-center font-bold";
                } else {
                    tocarBiPeFim();
                    btn.classList.remove('receiving');
                    txt.innerText = "Pronto para transmitir";
                    txt.className = "text-xs text-gray-400 mt-4 text-center font-medium";
                }
            });

            // Recebe comandos rápidos ou GPS
            socket.on('ptt-comando', ({ remetente, texto }) => {
                tocarBiPeInicio();
                adicionarMensagemFeed(texto, 'recebido', remetente);
            });

            // --- SINALIZAÇÃO WEBRTC VIA SOCKET.IO ---
            socket.on('webrtc-offer', async ({ remetente, offer }) => {
                numeroDestino = remetente;
                atualizarInterfaceNumeros();
                await prepararWebRTC();
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('webrtc-answer', { destino: remetente, remetente: meuNumero, answer });
                adicionarMensagemFeed(`Canal de voz P2P conectado com ${remetente}`, 'sistema');
            });

            socket.on('webrtc-answer', async ({ remetente, answer }) => {
                if (peerConnection) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                    adicionarMensagemFeed(`Canal de voz P2P aceito por ${remetente}`, 'sistema');
                }
            });

            socket.on('webrtc-ice', async ({ candidate }) => {
                if (peerConnection && candidate) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                    } catch (e) {}
                }
            });
        }

        function selecionarDestinoRapido(num) {
            if (num !== meuNumero) {
                document.getElementById('inputDestinoNum').value = num;
            }
        }

        // --- 4. WEBRTC ÁUDIO P2P EM TEMPO REAL ---
        async function prepararWebRTC() {
            if (!localStream) {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                // Começa mutado até apertar o botão PTT
                localStream.getAudioTracks().forEach(track => track.enabled = false);
            }

            peerConnection = new RTCPeerConnection(rtcConfig);

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                const audioRemoto = document.getElementById('audioRemoto');
                audioRemoto.srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && socket) {
                    socket.emit('webrtc-ice', { destino: numeroDestino, candidate: event.candidate });
                }
            };
        }

        async function iniciarChamadaWebRTC() {
            try {
                await prepararWebRTC();
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('webrtc-offer', {
                    destino: numeroDestino,
                    remetente: meuNumero,
                    offer: offer
                });
                adicionarMensagemFeed(`Chamando canal P2P de ${numeroDestino}...`, 'sistema');
            } catch (err) {
                alert("Permita o acesso ao microfone para abrir o canal de voz P2P.");
            }
        }

        // --- 5. CONTROLE DO BOTÃO PTT & BIPES ---
        async function iniciarTransmissao() {
            if (!localStream) {
                try {
                    await prepararWebRTC();
                } catch (e) {}
            }
            if (localStream) {
                localStream.getAudioTracks().forEach(track => track.enabled = true);
            }

            isTransmitting = true;
            document.getElementById('pttMainBtn').classList.add('active');
            document.getElementById('ondaAudio').classList.remove('hidden');
            document.getElementById('pttStatusText').innerText = `TRANSMITINDO PARA ${numeroDestino}...`;
            document.getElementById('pttStatusText').className = "text-xs text-red-400 mt-4 text-center font-bold";
            tocarBiPeInicio();

            if (socket) {
                socket.emit('ptt-status', { destino: numeroDestino, remetente: meuNumero, acao: 'falando' });
            }
        }

        function pararTransmissao() {
            if (!travaPTTAtiva && isTransmitting) {
                if (localStream) {
                    localStream.getAudioTracks().forEach(track => track.enabled = false);
                }
                isTransmitting = false;
                document.getElementById('pttMainBtn').classList.remove('active');
                document.getElementById('ondaAudio').classList.add('hidden');
                document.getElementById('pttStatusText').innerText = "Pronto para transmitir";
                document.getElementById('pttStatusText').className = "text-xs text-gray-400 mt-4 text-center font-medium";
                tocarBiPeFim();

                if (socket) {
                    socket.emit('ptt-status', { destino: numeroDestino, remetente: meuNumero, acao: 'escutando' });
                }
            }
        }

        function alternarBloqueioPTT() {
            travaPTTAtiva = !travaPTTAtiva;
            const btn = document.getElementById('btnTravaPTT');
            if (travaPTTAtiva) {
                btn.classList.add('bg-orange-600', 'text-white');
                btn.innerHTML = '<i class="fa-solid fa-lock mr-1"></i> PTT Travado';
                iniciarTransmissao();
            } else {
                btn.classList.remove('bg-orange-600', 'text-white');
                btn.innerHTML = '<i class="fa-solid fa-lock-open mr-1"></i> Trava PTT';
                pararTransmissao();
            }
        }

        function tocarBiPeInicio() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(1250, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.09);
            } catch(e) {}
        }

        function tocarBiPeFim() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.frequency.setValueAtTime(850, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch(e) {}
        }

        // --- 6. COMANDOS AUTOMATIZADOS & GPS ---
        function enviarComandoAutomatico(texto) {
            tocarBiPeInicio();
            adicionarMensagemFeed(texto, 'voce', meuNumero);
            if (socket) {
                socket.emit('ptt-comando', { destino: numeroDestino, remetente: meuNumero, texto });
            }
            setTimeout(tocarBiPeFim, 150);
        }

        function enviarLocalizacaoGPS() {
            if (!navigator.geolocation) {
                enviarComandoAutomatico("📍 GPS não suportado neste aparelho.");
                return;
            }
            navigator.geolocation.getCurrentPosition((pos) => {
                const link = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
                enviarComandoAutomatico(`📍 Minha localização atual: ${link}`);
            }, () => {
                enviarComandoAutomatico("📍 Localização: Aeroporto Confins (Sinal GPS indisponível)");
            });
        }

        function adicionarMensagemFeed(texto, tipo, remetente = '') {
            const feed = document.getElementById('chatFeed');
            const div = document.createElement('div');
            const hora = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            if (tipo === 'sistema') {
                div.className = "text-center my-1";
                div.innerHTML = `<span class="bg-gray-800/90 text-orange-400 text-[11px] px-3 py-1 rounded-full">${texto}</span>`;
            } else {
                const isVoce = tipo === 'voce';
                div.className = `bg-[#1e1e1e] p-2.5 rounded-lg border-l-4 ${isVoce ? 'border-green-500' : 'border-orange-500'} flex items-center justify-between shadow`;
                div.innerHTML = `
                    <div class="pr-2 break-all">
                        <div class="text-xs font-bold ${isVoce ? 'text-green-400' : 'text-orange-400'}">${isVoce ? 'Você (' + meuNumero + ')' : remetente}</div>
                        <div class="text-sm text-gray-200">${texto}</div>
                    </div>
                    <div class="text-right text-[11px] text-gray-400 shrink-0">${hora}</div>
                `;
            }
            feed.appendChild(div);
            feed.scrollTop = feed.scrollHeight;
        }

        // Modais
        function abrirConfiguracoesLinha() { document.getElementById('modalConfigLinha').classList.remove('hidden'); }
        function fecharConfiguracoesLinha() { document.getElementById('modalConfigLinha').classList.add('hidden'); }
        function abrirPerfil() { document.getElementById('modalPerfil').classList.remove('hidden'); }
        function fecharPerfil() { document.getElementById('modalPerfil').classList.add('hidden'); }
        function limparNotificacoes() { document.getElementById('chatFeed').innerHTML = ''; fecharPerfil(); }

        window.onload = () => {
            conectarSocketIO();
        };
    </script>
</body>
